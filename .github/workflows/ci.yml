name: Compile check

on:
  workflow_call:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          # SM 1.12 (API v8) - legacy
          - platform: ubuntu-24.04
            os: ubuntu-24.04
            sm: "1.12"
            sm_branch: "1.12-dev"
          - platform: windows-2022
            os: windows-2022
            sm: "1.12"
            sm_branch: "1.12-dev"
          # SM 1.13 (API v9) - fix "Extension version is too old to load (8, max is 9)"
          # master == 1.13 on alliedmodders/sourcemod
          - platform: ubuntu-24.04
            os: ubuntu-24.04
            sm: "1.13"
            sm_branch: "master"
          - platform: windows-2022
            os: windows-2022
            sm: "1.13"
            sm_branch: "master"

    name: ${{ matrix.platform }} SM${{ matrix.sm }}
    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4
        name: Repository checkout
        with:
          fetch-depth: 0
          submodules: true

      - uses: actions/checkout@v4
        name: SourceMod checkout SM${{ matrix.sm }}
        with:
          repository: alliedmodders/sourcemod
          ref: ${{ matrix.sm_branch }}
          submodules: true
          path: cache/sourcemod

      - uses: actions/checkout@v4
        name: AMBuild checkout
        with:
          repository: alliedmodders/ambuild
          ref: master
          path: cache/ambuild

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Setup AMBuild
        run: python -m pip install ./cache/ambuild

      - name: Download Boost headers
        shell: bash
        run: |
          curl -fsSL -o boost.tar.gz https://github.com/boostorg/boost/releases/download/boost-1.86.0/boost-1.86.0-b2-nodocs.tar.gz
          tar -xzf boost.tar.gz
          mv boost-1.86.0 boost
          test -f boost/boost/asio.hpp

      - name: Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo dpkg --add-architecture i386
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            gcc-multilib g++-multilib libstdc++6 lib32stdc++6 \
            libc6-dev libc6-dev-i386 linux-libc-dev linux-libc-dev:i386 lib32z1-dev

      - name: Build
        shell: bash
        run: |
          mkdir build
          cd build
          python ../configure.py --enable-optimize \
            --sm-path="$GITHUB_WORKSPACE/cache/sourcemod" \
            --boost-path="$GITHUB_WORKSPACE/boost" \
            --targets=x86,x86_64
          ambuild

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: socket_${{ matrix.os }}_sm${{ matrix.sm }}
          path: build/package
          if-no-files-found: error
