name: Build release

on:
  push:
    tags:
      - 'v*'

jobs:
  build:
    name: ${{ matrix.os }} ${{ matrix.arch }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            arch: x86
          - os: ubuntu-latest
            arch: x86_64
          - os: windows-latest
            arch: x86
            msvc_arch: x86
          - os: windows-latest
            arch: x86_64
            msvc_arch: x64

    steps:
      - name: Checkout sm-ext-socket
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Checkout SourceMod
        uses: actions/checkout@v4
        with:
          repository: alliedmodders/sourcemod
          ref: '1.12-dev'
          path: sourcemod
          fetch-depth: 1
          submodules: recursive

      - name: Checkout AMBuild
        uses: actions/checkout@v4
        with:
          repository: alliedmodders/ambuild
          path: ambuild
          fetch-depth: 1

      - name: Install AMBuild
        run: python -m pip install ./ambuild

      - name: Download Boost headers
        shell: bash
        run: |
          curl -fsSL -o boost.tar.gz https://github.com/boostorg/boost/releases/download/boost-1.86.0/boost-1.86.0-b2-nodocs.tar.gz
          tar -xzf boost.tar.gz
          mv boost-1.86.0 boost
          test -f boost/boost/asio.hpp

      - name: Install 32-bit Linux toolchain
        if: runner.os == 'Linux' && matrix.arch == 'x86'
        run: sudo apt-get update && sudo apt-get install -y gcc-multilib g++-multilib

      - name: Set up MSVC environment
        if: runner.os == 'Windows'
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: ${{ matrix.msvc_arch }}

      - name: Configure
        shell: bash
        run: |
          mkdir -p build
          cd build
          python ../configure.py --sm-path=../sourcemod --boost-path=../boost --targets=${{ matrix.arch }} --enable-optimize

      - name: Build
        shell: bash
        run: |
          cd build
          if command -v ambuild >/dev/null 2>&1; then
            ambuild
          else
            python -c "from ambuild2.run import cli_run; cli_run()"
          fi

      - name: Stage build output
        shell: bash
        run: |
          set -e
          case "${{ matrix.os }}" in
            windows-latest) ext=dll ;;
            *) ext=so ;;
          esac
          if [ "${{ matrix.arch }}" = "x86" ]; then
            bin="build/package/addons/sourcemod/extensions/socket.ext.$ext"
          else
            bin="build/package/addons/sourcemod/extensions/x64/socket.ext.$ext"
          fi
          mkdir -p dist
          cp "$bin" "dist/socket.ext.$ext"
          cp build/package/addons/sourcemod/scripting/include/socket.inc dist/socket.inc
          ls -la dist

      - name: Upload extension
        uses: actions/upload-artifact@v4
        with:
          name: socket-${{ matrix.os }}-${{ matrix.arch }}
          path: dist/
          if-no-files-found: error

  release:
    name: Publish release
    needs: build
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Download binaries
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Package Linux (tar.gz)
        shell: bash
        run: |
          set -e
          mkdir -p pkg-linux/addons/sourcemod/extensions/x64
          mkdir -p pkg-linux/addons/sourcemod/scripting/include
          cp artifacts/socket-ubuntu-latest-x86/socket.ext.so pkg-linux/addons/sourcemod/extensions/socket.ext.so
          cp artifacts/socket-ubuntu-latest-x86_64/socket.ext.so pkg-linux/addons/sourcemod/extensions/x64/socket.ext.so
          cp artifacts/socket-ubuntu-latest-x86_64/socket.inc pkg-linux/addons/sourcemod/scripting/include/socket.inc
          tar -czf sourcemod-socket-linux.tar.gz -C pkg-linux .
          ls -la sourcemod-socket-linux.tar.gz

      - name: Package Windows (zip)
        shell: bash
        run: |
          set -e
          mkdir -p pkg-windows/addons/sourcemod/extensions/x64
          mkdir -p pkg-windows/addons/sourcemod/scripting/include
          cp artifacts/socket-windows-latest-x86/socket.ext.dll pkg-windows/addons/sourcemod/extensions/socket.ext.dll
          cp artifacts/socket-windows-latest-x86_64/socket.ext.dll pkg-windows/addons/sourcemod/extensions/x64/socket.ext.dll
          cp artifacts/socket-windows-latest-x86_64/socket.inc pkg-windows/addons/sourcemod/scripting/include/socket.inc
          (cd pkg-windows && zip -r ../sourcemod-socket-windows.zip .)
          ls -la sourcemod-socket-windows.zip

      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            sourcemod-socket-linux.tar.gz
            sourcemod-socket-windows.zip
