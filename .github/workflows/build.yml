name: Build

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    name: ${{ matrix.os }} ${{ matrix.arch }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            arch: x86
          - os: ubuntu-latest
            arch: x86_64
          - os: windows-latest
            arch: x86
            msvc_arch: x86
          - os: windows-latest
            arch: x86_64
            msvc_arch: x64

    steps:
      - name: Checkout sm-ext-socket
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Checkout SourceMod
        uses: actions/checkout@v4
        with:
          repository: alliedmodders/sourcemod
          path: sourcemod
          fetch-depth: 1
          submodules: recursive

      - name: Checkout AMBuild
        uses: actions/checkout@v4
        with:
          repository: alliedmodders/ambuild
          path: ambuild
          fetch-depth: 1

      - name: Install AMBuild
        run: python -m pip install ./ambuild

      - name: Download Boost headers
        shell: bash
        run: |
          curl -fsSL -o boost.tar.gz https://github.com/boostorg/boost/releases/download/boost-1.86.0/boost-1.86.0-b2-nodocs.tar.gz
          tar -xzf boost.tar.gz
          mv boost-1.86.0 boost
          test -f boost/boost/asio.hpp

      - name: Install 32-bit Linux toolchain
        if: runner.os == 'Linux' && matrix.arch == 'x86'
        run: sudo apt-get update && sudo apt-get install -y gcc-multilib g++-multilib

      - name: Set up MSVC environment
        if: runner.os == 'Windows'
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: ${{ matrix.msvc_arch }}

      - name: Configure
        shell: bash
        run: |
          mkdir -p build
          cd build
          python ../configure.py --sm-path=../sourcemod --boost-path=../boost --targets=${{ matrix.arch }} --enable-optimize

      - name: Build
        shell: bash
        run: |
          cd build
          if command -v ambuild >/dev/null 2>&1; then
            ambuild
          else
            python -c "from ambuild2.run import cli_run; cli_run()"
          fi

      - name: Verify binary
        shell: bash
        run: |
          ls -la build/package/addons/sourcemod/extensions/

      - name: Relocate x64 Windows binary
        if: runner.os == 'Windows' && matrix.arch == 'x86_64'
        shell: bash
        run: |
          mkdir -p build/package/addons/sourcemod/extensions/x64
          mv build/package/addons/sourcemod/extensions/socket.ext.dll build/package/addons/sourcemod/extensions/x64/
          ls -la build/package/addons/sourcemod/extensions/x64/

      - name: Upload extension
        uses: actions/upload-artifact@v4
        with:
          name: socket-ext-${{ matrix.os }}-${{ matrix.arch }}
          path: |
            build/package/addons/sourcemod/extensions/
            build/package/addons/sourcemod/scripting/include/socket.inc
          if-no-files-found: error
