name: Build release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build-extension:
    uses: ./.github/workflows/ci.yml

  release:
    permissions: write-all
    runs-on: ubuntu-latest
    needs: [build-extension]

    steps:
      - run: sudo apt-get install -y tree

      - name: Download Linux SM1.12
        uses: actions/download-artifact@v4
        with:
          name: socket_ubuntu-24.04_sm1.12
          path: pkg_linux_sm112

      - name: Download Windows SM1.12
        uses: actions/download-artifact@v4
        with:
          name: socket_windows-2022_sm1.12
          path: pkg_windows_sm112

      - name: Download Linux SM1.13
        uses: actions/download-artifact@v4
        with:
          name: socket_ubuntu-24.04_sm1.13
          path: pkg_linux_sm113

      - name: Download Windows SM1.13
        uses: actions/download-artifact@v4
        with:
          name: socket_windows-2022_sm1.13
          path: pkg_windows_sm113

      - name: Prepare archives
        run: |
          ls -R pkg_linux_sm112
          ls -R pkg_windows_sm112
          ls -R pkg_linux_sm113
          ls -R pkg_windows_sm113
          echo "--- Packing SM 1.12 ---"
          (cd pkg_linux_sm112 && tar -czf ../sourcemod-socket-linux.tar.gz *)
          (cd pkg_windows_sm112 && zip -r ../sourcemod-socket-windows.zip *)
          echo "--- Packing SM 1.13 ---"
          (cd pkg_linux_sm113 && tar -czf ../sourcemod-socket-linux-sm1.13.tar.gz *)
          (cd pkg_windows_sm113 && zip -r ../sourcemod-socket-windows-sm1.13.zip *)
          ls -lh *.tar.gz *.zip
          tree -L 4 || true

      - name: Create Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            sourcemod-socket-linux.tar.gz
            sourcemod-socket-windows.zip
            sourcemod-socket-linux-sm1.13.tar.gz
            sourcemod-socket-windows-sm1.13.zip
          body: |
            ### Socket Extension ${{ github.ref_name }}
            - `sourcemod-socket-linux.tar.gz` / `sourcemod-socket-windows.zip` -> **SourceMod 1.12** (API v8)
            - `sourcemod-socket-linux-sm1.13.tar.gz` / `sourcemod-socket-windows-sm1.13.zip` -> **SourceMod 1.13** (API v9, fix `Extension version is too old to load (8, max is 9)`)
            Built directly from `build/package` without manual staging (pattern `ci-ext.yml`/`release.yml`).
