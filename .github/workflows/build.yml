name: Build release

on:
  push:
    tags:
      - 'v*'

jobs:
  build:
    name: ${{ matrix.os }} ${{ matrix.arch }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            arch: x86
          - os: ubuntu-latest
            arch: x86_64
          - os: windows-latest
            arch: x86
            msvc_arch: x86
          - os: windows-latest
            arch: x86_64
            msvc_arch: x64

    steps:
      - name: Checkout sm-ext-socket
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Checkout SourceMod
        uses: actions/checkout@v4
        with:
          repository: alliedmodders/sourcemod
          ref: '1.12-dev'
          path: sourcemod
          fetch-depth: 1
          submodules: recursive

      - name: Checkout AMBuild
        uses: actions/checkout@v4
        with:
          repository: alliedmodders/ambuild
          path: ambuild
          fetch-depth: 1

      - name: Install AMBuild
        run: python -m pip install ./ambuild

      - name: Download Boost headers
        shell: bash
        run: |
          curl -fsSL -o boost.tar.gz https://github.com/boostorg/boost/releases/download/boost-1.86.0/boost-1.86.0-b2-nodocs.tar.gz
          tar -xzf boost.tar.gz
          mv boost-1.86.0 boost
          test -f boost/boost/asio.hpp

      - name: Install 32-bit Linux toolchain
        if: runner.os == 'Linux' && matrix.arch == 'x86'
        run: sudo apt-get update && sudo apt-get install -y gcc-multilib g++-multilib

      - name: Set up MSVC environment
        if: runner.os == 'Windows'
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: ${{ matrix.msvc_arch }}

      - name: Configure
        shell: bash
        run: |
          mkdir -p build
          cd build
          python ../configure.py --sm-path=../sourcemod --boost-path=../boost --targets=${{ matrix.arch }} --enable-optimize

      - name: Build
        shell: bash
        run: |
          cd build
          if command -v ambuild >/dev/null 2>&1; then
            ambuild
          else
            python -c "from ambuild2.run import cli_run; cli_run()"
          fi

      - name: Stage release files
        shell: bash
        run: |
          set -e
          case "${{ matrix.os }}" in
            windows-latest) ext=dll ;;
            *) ext=so ;;
          esac
          if [ "${{ matrix.arch }}" = "x86" ]; then
            subdir=""
          else
            subdir="x64"
          fi

          bin="build/package/addons/sourcemod/extensions/$subdir/socket.ext.$ext"
          mkdir -p dist
          cp "$bin" "dist/socket.ext.$ext"
          cp build/package/addons/sourcemod/scripting/include/socket.inc dist/socket.inc
          ls -la dist

      - name: Upload extension
        uses: actions/upload-artifact@v4
        with:
          name: socket-ext-${{ matrix.os }}-${{ matrix.arch }}
          path: dist/
          if-no-files-found: error

  release:
    name: Publish release
    needs: build
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Download binaries
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: List release files
        shell: bash
        run: find artifacts -type f

      - name: Rename release assets to unique names
        shell: bash
        run: |
          set -e
          cd artifacts
          first_inc=""
          for dir in */; do
            os_arch="${dir%/}"
            os_arch="${os_arch#socket-ext-}"
            for bin in socket.ext.so socket.ext.dll; do
              if [ -f "$dir$bin" ]; then
                cp "$dir$bin" "$dir$os_arch.ext.${bin##*.}"
                rm -f "$dir$bin"
              fi
            done
            if [ -f "$dir"socket.inc ]; then
              if [ -z "$first_inc" ]; then
                first_inc=1
              else
                rm -f "$dir"socket.inc
              fi
            fi
          done
          find . -type f

      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          files: artifacts/**/*
